<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบบันทึกรายรับรายจ่าย</title>
  <style>
    :root {
      /* Palette */
      --morning-butter: #F3D98F;
      --blue-grey: #7298C7;
      --lime-400: #A3E635;

      /* Light Glass Base */
      --bg-color: #EBF1F6;
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-card: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.8);
      --glass-shadow: 0 10px 30px rgba(114, 152, 199, 0.15);
      
      --text-main: #1C273A;
      --text-sub: #64748B;

      /* Header & Elements Light */
      --icon-box-bg: rgba(163, 230, 53, 0.25);
      --icon-box-color: #3F6212;
      --btn-pill-bg: rgba(255, 255, 255, 0.65);
      --btn-pill-border: rgba(255, 255, 255, 0.9);
      
      /* Functional Colors */
      --income-color: #166534;
      --income-bg: rgba(220, 252, 231, 0.75);
      --expense-color: #991B1B;
      --expense-bg: rgba(254, 226, 226, 0.75);
      --deduction-color: #9A3412;
      --deduction-bg: rgba(255, 237, 213, 0.75);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    body { 
      background-color: var(--bg-color); 
      background-image: 
        radial-gradient(at 10% 10%, rgba(114, 152, 199, 0.3) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(163, 230, 53, 0.25) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(243, 217, 143, 0.2) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main); 
      min-height: 100vh; 
      padding-bottom: 110px; 
    }

    .container { padding: 0 18px; }

    /* App Header */
    .app-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 20px 22px 16px; 
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    
    .home-icon-box { 
      width: 44px; height: 44px; border-radius: 16px; 
      background: var(--icon-box-bg); color: var(--icon-box-color); 
      display: flex; align-items: center; justify-content: center; 
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 15px rgba(163, 230, 53, 0.25);
    }
    .home-icon-box svg { width: 22px; height: 22px; fill: currentColor; }
    .app-title { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }

    /* Main Balance Card */
    .balance-card { 
      background: linear-gradient(135deg, rgba(114, 152, 199, 0.85) 0%, rgba(91, 130, 179, 0.75) 100%); 
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: 28px; padding: 26px; 
      border: 1px solid rgba(255, 255, 255, 0.5); 
      margin-bottom: 18px; color: #FFFFFF; 
      box-shadow: 0 16px 32px -8px rgba(114, 152, 199, 0.35); 
      position: relative; overflow: hidden;
    }
    .balance-label { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.85); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    .balance-amount { font-size: 34px; font-weight: 800; color: #FFFFFF; }

    /* Stats Grid Glass Cards */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 22px; }
    .stat-card { 
      background: var(--glass-card); 
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-radius: 20px; padding: 16px 8px; 
      border: 1px solid var(--glass-border); 
      text-align: center; box-shadow: var(--glass-shadow);
    }
    .stat-label { font-size: 10px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; margin-bottom: 6px; }
    .stat-value { font-size: 14px; font-weight: 800; }
    .stat-card.income .stat-value { color: var(--income-color); }
    .stat-card.expense .stat-value { color: var(--expense-color); }
    .stat-card.deduction .stat-value { color: var(--deduction-color); }

    /* Highlights Section */
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .section-title { font-size: 13px; font-weight: 800; letter-spacing: 0.8px; color: var(--text-sub); text-transform: uppercase; }

    .entry-list { display: flex; flex-direction: column; gap: 12px; }
    .entry-item { 
      background: var(--glass-card); 
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-radius: 20px; padding: 16px 18px; 
      border: 1px solid var(--glass-border); 
      display: flex; justify-content: space-between; align-items: center; 
      box-shadow: var(--glass-shadow);
    }
    .entry-title { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 3px; }
    .entry-date { font-size: 12px; color: var(--text-sub); }
    .entry-amount { font-size: 16px; font-weight: 800; }
    .entry-amount.income { color: var(--income-color); }
    .entry-amount.expense { color: var(--expense-color); }
    .entry-amount.deduction { color: var(--deduction-color); }

    /* Floating Bottom Action Bar */
    .bottom-bar { 
      position: fixed; bottom: 0; left: 0; right: 0; 
      background: var(--glass-bg); 
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--glass-border); 
      padding: 14px 20px 28px; display: flex; justify-content: center; z-index: 100; 
    }
    .add-btn { 
      background: linear-gradient(135deg, #A3E635 0%, #84CC16 100%); 
      color: #1A2E05; border: 1px solid rgba(255,255,255,0.6); 
      padding: 15px 42px; border-radius: 30px; font-size: 15px; font-weight: 800; 
      cursor: pointer; display: flex; align-items: center; gap: 8px; 
      box-shadow: 0 8px 25px rgba(163, 230, 53, 0.45); 
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="header-left">
      <div class="home-icon-box">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </div>
      <div class="app-title">OVERVIEW</div>
    </div>
  </div>

  <div class="container">
    <div class="balance-card">
      <div class="balance-label">BALANCE</div>
      <div class="balance-amount">฿17,569.70</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card income">
        <div class="stat-label">INCOME</div>
        <div class="stat-value">฿18,300.00</div>
      </div>
      <div class="stat-card expense">
        <div class="stat-label">EXPENSE</div>
        <div class="stat-value">฿730.30</div>
      </div>
      <div class="stat-card deduction">
        <div class="stat-label">DEDUCTION</div>
        <div class="stat-value">฿0.00</div>
      </div>
    </div>

    <div class="section-header">
      <div class="section-title">LATEST ENTRIES</div>
    </div>

    <div class="entry-list">
      <div class="entry-item">
        <div>
          <div class="entry-title">3BB</div>
          <div class="entry-date">05/08/2026</div>
        </div>
        <div class="entry-amount expense">-฿730.30</div>
      </div>

      <div class="entry-item">
        <div>
          <div class="entry-title">เงินเดือน</div>
          <div class="entry-date">05/08/2026</div>
        </div>
        <div class="entry-amount income">+฿18,300.00</div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSc_EXAMPLE/viewform" target="_blank" class="add-btn">
      + New Entry
    </a>
  </div>

</body>
</html>
